<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal RPG - AI Text-Based Adventure Game</title>
  <meta name="description" content="Play Terminal RPG, a free AI-powered text-based adventure game in your browser. Choose your theme and embark on a unique single-player RPG experience!">
  <meta name="keywords" content="terminal rpg, text rpg, browser rpg, ai rpg, ai adventure game, text adventure game, free rpg, online rpg, single player rpg, openrouter api rpg">
  <meta name="author" content="Levent Özgür">
  <link rel="canonical" href="https://terminal-rpg.netlify.app/">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="css/icon.favicon">

  <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "SoftwareApplication",
      "name": "Terminal RPG",
      "url": "https://terminal-rpg.netlify.app/",
      "description": "Terminal RPG is an AI-powered text-based adventure game playable directly in your browser. Explore various themes and embark on countless unique single-player RPG adventures.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Browser",
      "author": {
        "@type": "Person",
        "name": "Levent Özgür"
      }
    }
  </script>
</head>

<body>
  <div class="terminal-window">
    <!-- Main Terminal Content -->
    <div class="terminal-content" id="terminal-output">
      <div class="startup-info">
        <span class="title">Terminal RPG v1.0</span> by <a href="https://github.com/levent1ozgur" target="_blank"><span class="author">Levent Özgür</span></a><br>
        Copyright (c) 2025.<br><br><br>
        <em>> Wake up</em> to initialize<br><br>
        <em>> Help</em> for assistance<br><br>
      </div>
      <div class="game-output" id="game-narrative">
        <!-- Game narrative will be dynamically inserted here -->
      </div>
    </div>

    <!-- Input Area -->
    <div class="terminal-input-container">
      <span class="terminal-prompt">></span>
      <input type="text" class="terminal-input" id="command-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Command input">
    </div>

    <!-- Loading spinner -->
    <div id="loading-spinner" class="loading-spinner hidden">
      <div class="spinner"></div>
      <p>Processing...</p>
    </div>

    <!-- Accessibility status announcer (invisible for screen readers) -->
    <div id="a11y-status" class="sr-only" role="status" aria-live="polite"></div>
  </div>

  <script src="js/main.js"></script>
  <script id="counterscale-script"
    data-site-id="terminal-rpg"
    src="https://counterscale.131095.workers.dev/tracker.js"
    defer></script>
</body>

</html>
